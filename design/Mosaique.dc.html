<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F6F8B; } a:hover { color: #175567; }
    .t-clair {
      --surface: #FBFAF9; --work: #FFFFFF; --ink: #17171A; --quiet: #6E6E75;
      --line: #E7E5E2; --hover: #F5F4F1;
      --broken: #A8301C; --moved: #8A6410; --unsure: #9A9A96;
      --tag-l: 0.94; --tag-c: 0.045; --tag-tl: 0.42; --tag-tc: 0.11;
      --icon-l: 0.62; --icon-c: 0.11; --wash-l: 0.95; --wash-c: 0.035;
    }
    .t-sombre {
      --surface: #161618; --work: #1E1E21; --ink: #ECECE9; --quiet: #9B9BA2;
      --line: #2C2C30; --hover: #252528;
      --broken: #E06A52; --moved: #D4A03C; --unsure: #6B6B68;
      --tag-l: 0.30; --tag-c: 0.05; --tag-tl: 0.80; --tag-tc: 0.09;
      --icon-l: 0.68; --icon-c: 0.11; --wash-l: 0.32; --wash-c: 0.05;
    }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tag {
      display: inline-flex; align-items: center; height: 18px; padding: 0 7px;
      border-radius: 9px; font-size: 11px; font-weight: 500; white-space: nowrap;
      background: oklch(var(--tag-l) calc(var(--tag-c) * var(--sat, 1)) var(--h));
      color: oklch(var(--tag-tl) calc(var(--tag-tc) * var(--sat, 1)) var(--h));
    }
    .tuile { transition: border-color 120ms ease; }
    .tuile:hover { border-color: var(--quiet); }
    .nav:hover { background: var(--hover); }
    .clamp2 {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; text-wrap: pretty;
    }
  </style>
</helmet>

<div class="{{themeClass}}" style="display: flex; flex-direction: column; width: 1440px; height: 900px; background: var(--surface); color: var(--ink); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px; width: 300px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--work);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color: var(--quiet); flex-shrink: 0;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="color: var(--quiet);">Rechercher</span>
      <span class="mono" style="margin-left: auto; font-size: 11px; color: var(--quiet);">⌘K</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 4px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; color: var(--quiet);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; background: var(--line);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      </div>
      <div style="width: 1px; height: 18px; background: var(--line); margin: 0 8px;"></div>
      <span style="color: var(--quiet); font-size: 12px;">Développement · 3 480 éléments</span>
    </div>
  </div>

  <div style="display: flex; flex-grow: 1; min-height: 0;">

    <div style="display: flex; flex-direction: column; width: 258px; flex-shrink: 0; padding: 12px 8px; gap: 1px; border-right: 1px solid var(--line); overflow: hidden;">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
        <div class="nav {{n.cls}}" style="display: flex; align-items: center; height: 26px; border-radius: 7px; cursor: default; padding-right: 8px;">
          <div style="width: {{n.retrait}}; flex-shrink: 0; height: 26px; display: flex; justify-content: flex-end;">
            <div style="width: 2px; height: 26px; background: {{n.filet}};"></div>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; width: 14px; flex-shrink: 0; color: var(--quiet);">
            <sc-if value="{{n.pliable}}" hint-placeholder-val="{{true}}">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="transform: rotate({{n.rotation}});"><path d="M9 6l6 6-6 6"></path></svg>
            </sc-if>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; margin-right: 8px; background: {{n.fondIcone}}; color: {{n.couleur}};">
            <sc-if value="{{n.aIcone}}" hint-placeholder-val="{{true}}">
              <div style="width: 10px; height: 10px; border-radius: 3px; background: {{n.couleur}};"></div>
            </sc-if>
            <sc-if value="{{n.sansIcone}}" hint-placeholder-val="{{true}}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
            </sc-if>
          </div>
          <span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: {{n.graisse}};">{{n.nom}}</span>
          <span class="mono" style="font-size: 11px; color: var(--quiet); flex-shrink: 0;">{{n.compte}}</span>
        </div>
      </sc-for>
      <div style="height: 16px;"></div>
      <div style="padding: 0 9px 7px; font-size: 12px; font-weight: 590; color: var(--quiet);">Étiquettes</div>
      <div style="display: flex; flex-wrap: wrap; gap: 5px; padding: 0 9px;">
        <sc-for list="{{tagsNav}}" as="t" hint-placeholder-count="8">
          <span class="tag" style="--h: {{t.h}}; --sat: {{t.sat}};">{{t.nom}}</span>
        </sc-for>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; padding: 16px; overflow: hidden;">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;">
        <sc-for list="{{tuiles}}" as="t" hint-placeholder-count="15">
          <div class="tuile" style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--work); overflow: hidden; cursor: default;">

            <div style="position: relative; height: 118px; display: flex; flex-direction: column; gap: 6px; padding: 14px; background: {{t.fond}}; overflow: hidden;">
              <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background-image: {{t.gutter}}; background-color: {{t.gutterBg}};"></div>

              <sc-if value="{{t.aVignette}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <div style="height: 8px; width: 64%; border-radius: 3px; background: {{t.trait}};"></div>
                  <div style="height: 5px; width: 92%; border-radius: 3px; background: {{t.trait}}; opacity: 0.5;"></div>
                  <div style="height: 5px; width: 78%; border-radius: 3px; background: {{t.trait}}; opacity: 0.5;"></div>
                  <div style="height: 40px; margin-top: 4px; border-radius: 5px; background: {{t.trait}}; opacity: 0.26;"></div>
                </div>
              </sc-if>

              <sc-if value="{{t.sansVignette}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
                  <div style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 12px; background: {{t.trait}}; color: var(--work); font-size: 20px; font-weight: 590;">{{t.initiale}}</div>
                </div>
              </sc-if>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; padding: 11px 12px 12px;">
              <div class="clamp2" style="font-weight: 500; line-height: 1.35; height: 35px;">{{t.titre}}</div>
              <div style="display: flex; gap: 5px; overflow: hidden;">
                <sc-for list="{{t.tags}}" as="g" hint-placeholder-count="2">
                  <span class="tag" style="--h: {{g.h}}; --sat: {{g.sat}};">{{g.nom}}</span>
                </sc-for>
              </div>
              <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
                <div title="{{t.coll}}" style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; background: {{t.collFond}}; color: {{t.collInk}};">
                  <sc-if value="{{t.collIcone}}" hint-placeholder-val="{{true}}">
                    <div style="width: 9px; height: 9px; border-radius: 2px; background: {{t.collInk}};"></div>
                  </sc-if>
                  <sc-if value="{{t.collDossier}}" hint-placeholder-val="{{true}}">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                  </sc-if>
                </div>
                <div class="mono" style="font-size: 11px; color: var(--quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{t.domaine}}</div>
              </div>
            </div>

          </div>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair","section":"Affichage"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  // La teinte vient du SENS, pas de l'orthographe : bleu pour la technique,
  // vert pour l'argent, ambre pour la maison… Un mot non reconnu reste gris,
  // ce qui se voit — et se corrige en ajoutant le mot au lexique.
  themes() {
    return [
      { nom: "technique", h: 250, mots: ["code", "dev", "développement", "programmation", "informatique", "typescript", "javascript", "python", "rust", "linux", "mac", "logiciel", "api", "serveur", "git", "données", "langage", "build", "test"] },
      { nom: "création", h: 300, mots: ["design", "webdesign", "typographie", "police", "graphisme", "illustration", "couleur", "art", "photo", "ui", "ux", "système de design"] },
      { nom: "argent", h: 150, mots: ["achat", "finance", "banque", "budget", "prix", "vente", "boutique", "économie", "facture", "comparer"] },
      { nom: "maison", h: 62, mots: ["maison", "cuisine", "recette", "pâtisserie", "bricolage", "jardin", "déco", "meuble", "matériel", "périphérique"] },
      { nom: "santé", h: 25, mots: ["santé", "médecine", "sport", "urgent", "important", "sécurité", "à-revoir", "à-traiter"] },
      { nom: "lieux", h: 195, mots: ["voyage", "carte", "ville", "pays", "transport", "train", "hôtel", "restaurant", "lieu"] },
      { nom: "culture", h: 345, mots: ["lecture", "livre", "article", "veille", "musique", "film", "podcast", "histoire", "infolettre", "presse"] },
      { nom: "méthode", h: 120, mots: ["outil", "service", "application", "extension", "productivité", "méthode", "référence", "guide", "tutoriel", "archive"] }
    ];
  }

  theme(nom) {
    const n = (nom || "").toLowerCase();
    const liste = this.themes();
    for (let i = 0; i < liste.length; i++) {
      for (let j = 0; j < liste[i].mots.length; j++) {
        if (n.indexOf(liste[i].mots[j]) !== -1) return liste[i];
      }
    }
    return { nom: "hors lexique", h: 250, neutre: true };
  }

  teinte(nom) { return this.theme(nom).h; }
  sature(nom) { return this.theme(nom).neutre ? 0 : 1; }

  chips(noms) {
    return (noms || []).map((n) => ({ nom: n, h: this.teinte(n), sat: this.sature(n) }));
  }

  marques(etat) {
    switch (etat) {
      case "mort":        return { image: "none", bg: "var(--broken)" };
      case "redirige":    return { image: "repeating-linear-gradient(90deg, var(--moved) 0 4px, transparent 4px 8px)", bg: "transparent" };
      case "indetermine": return { image: "repeating-linear-gradient(90deg, var(--unsure) 0 1px, transparent 1px 3px)", bg: "transparent" };
      case "doublon":     return { image: "linear-gradient(180deg, var(--ink) 0 1px, transparent 1px 2px, var(--ink) 2px 3px)", bg: "transparent" };
      default:            return { image: "none", bg: "transparent" };
    }
  }

  // Une couleur par thématique : la racine la porte, ses descendantes en héritent.
  arbreNav() {
    const brut = [
      { id: 100, t: "Développement", n: 0, c: "3 480", ico: true, pliable: true, ouvert: true },
      { id: 110, t: "Langages", n: 1, c: "1 204", ico: true, pliable: true, ouvert: true },
      { id: 111, t: "TypeScript", n: 2, c: "412", ico: false },
      { id: 112, t: "Rust", n: 2, c: "289", ico: true },
      { id: 120, t: "Outils de build", n: 1, c: "876", ico: false, pliable: true },
      { id: 130, t: "Bases de données", n: 1, c: "618", ico: true },
      { id: 200, t: "Design", n: 0, c: "1 926", ico: true, pliable: true, ouvert: true },
      { id: 210, t: "Typographie", n: 1, c: "534", ico: true },
      { id: 220, t: "Systèmes de design", n: 1, c: "392", ico: false },
      { id: 300, t: "Veille et lecture", n: 0, c: "2 145", ico: false, pliable: true },
      { id: 400, t: "Maison et matériel", n: 0, c: "1 087", ico: true, pliable: true },
      { id: 500, t: "Recettes", n: 0, c: "612", ico: true, pliable: true }
    ];
    let racine = null;
    return brut.map((x) => {
      if (x.n === 0) racine = x;
      const h = this.teinte((racine || x).t);
      return {
        nom: x.t,
        compte: x.c,
        retrait: (x.n === 0 ? 2 : 8 + x.n * 14) + "px",
        filet: x.n === 0 ? "transparent" : "oklch(var(--wash-l) var(--wash-c) " + h + ")",
        pliable: !!x.pliable,
        rotation: x.pliable && x.ouvert ? "90deg" : "0deg",
        aIcone: !!x.ico,
        sansIcone: !x.ico,
        couleur: "oklch(var(--icon-l) var(--icon-c) " + h + ")",
        fondIcone: "oklch(var(--wash-l) var(--wash-c) " + h + ")",
        graisse: x.n === 0 ? "590" : "400",
        cls: ""
      };
    });
  }

  collectionDe(tags) {
    const t = (tags || [])[0] || "";
    const th = this.theme(t);
    const par = { technique: "Développement", "création": "Design", argent: "Achats", maison: "Maison", "santé": "Santé", lieux: "Voyages", culture: "Veille et lecture", "méthode": "Outils" };
    return par[th.nom] || "Non classés";
  }

  renderVals() {
    const theme = this.props.theme ?? "clair";

    const brut = [
      { titre: "Guide des Container Queries", domaine: "web.dev", etat: "", tags: ["webdesign", "code"], vignette: true, ico: true },
      { titre: "Une introduction aux types conditionnels en TypeScript", domaine: "typescriptlang.org", etat: "mort", tags: ["code"], vignette: true },
      { titre: "Comprendre les oklch en CSS", domaine: "evilmartians.com", etat: "", tags: ["webdesign"], vignette: true, ico: true },
      { titre: "Tauri 2 — le modèle de permissions", domaine: "v2.tauri.app", etat: "redirige", tags: ["code", "mac"], vignette: true },
      { titre: "Structure d'un projet Rust", domaine: "doc.rust-lang.org", etat: "", tags: ["code"], vignette: false },
      { titre: "Les pièges du fuseau horaire", domaine: "date-fns.org", etat: "doublon", tags: ["code"], vignette: true },
      { titre: "Virtualiser de longues listes sans casser le clavier", domaine: "tanstack.com", etat: "", tags: ["code"], vignette: true },
      { titre: "Le protocole MCP, vue d'ensemble", domaine: "modelcontextprotocol.io", etat: "", tags: ["informatique"], vignette: true },
      { titre: "Archiver le web avec ArchiveBox", domaine: "archivebox.io", etat: "indetermine", tags: ["linux", "outil-en-ligne"], vignette: true },
      { titre: "Sur la conception des systèmes de sauvegarde", domaine: "tarsnap.com", etat: "", tags: ["informatique"], vignette: false },
      { titre: "SQLite convient à votre application", domaine: "sqlite.org", etat: "", tags: ["code"], vignette: true, ico: true },
      { titre: "Les limites de l'API Raindrop", domaine: "developer.raindrop.io", etat: "redirige", tags: ["outil-en-ligne"], vignette: true },
      { titre: "Écrire des tests qui tiennent dans le temps", domaine: "kentcdodds.com", etat: "", tags: ["code"], vignette: true },
      { titre: "Une histoire des gestionnaires de favoris", domaine: "arstechnica.com", etat: "mort", tags: ["informatique"], vignette: true },
      { titre: "Les Server Components expliqués", domaine: "react.dev", etat: "", tags: ["code", "webdesign"], vignette: true }
    ];

    const tuiles = brut.map((b) => {
      const m = this.marques(b.etat);
      const coll = b.coll || this.collectionDe(b.tags);
      const h = this.teinte(coll);
      const sat = this.sature(coll);
      return {
        titre: b.titre,
        domaine: b.domaine,
        tags: this.chips(b.tags),
        aVignette: b.vignette,
        sansVignette: !b.vignette,
        initiale: b.domaine.charAt(0).toUpperCase(),
        coll: coll,
        collIcone: !!b.ico,
        collDossier: !b.ico,
        collInk: "oklch(var(--icon-l) calc(var(--icon-c) * " + sat + ") " + h + ")",
        collFond: "oklch(var(--wash-l) calc(var(--wash-c) * " + sat + ") " + h + ")",
        fond: b.vignette ? "oklch(var(--wash-l) calc(var(--wash-c) * " + sat + ") " + h + ")" : "var(--surface)",
        trait: "oklch(var(--icon-l) calc(var(--icon-c) * " + sat + ") " + h + ")",
        gutter: m.image,
        gutterBg: m.bg
      };
    });

    return {
      themeClass: theme === "sombre" ? "t-sombre" : "t-clair",
      nav: this.arbreNav(),
      tagsNav: this.chips(["code", "webdesign", "outil-en-ligne", "mac", "linux", "informatique", "achats", "typescript"]),
      tuiles: tuiles
    };
  }
}
</script>
</body>
</html>
