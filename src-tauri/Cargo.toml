[package]
name = "raindrop-gui"
version = "0.1.0"
description = "Raindrop GUI — navigation et nettoyage d'une bibliothèque Raindrop.io"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "raindrop_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# Déjà dans l'arbre en transitive (0.2.189) : ajouté comme directe pour
# `signaux.rs` — interception de SIGTERM, impossible sans appels libc.
libc = "0.2"
