[package]
name = "raindrop-gui"
version = "0.1.0"
description = "Raindrop GUI — navigation et nettoyage d'une bibliothèque Raindrop.io"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "raindrop_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# Déjà dans l'arbre en transitive (0.2.189) : ajouté comme directe pour
# `signaux.rs` — interception de SIGTERM, impossible sans appels libc.
libc = "0.2"
# Vérification SHASUMS256 du tarball du runtime Node géré (spec §3.2
# amendée) : un contrôle de sécurité ne se délègue pas à un binaire qui peut
# être absent — /usr/bin/shasum dépend du CLT.
sha2 = "0.10"
# Dialogue natif de choix de dossier (spec sélection §2) — côté Rust
# uniquement : le webview n'invoque que nos commandes, jamais le plugin.
tauri-plugin-dialog = "2"
